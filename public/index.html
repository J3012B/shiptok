<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#121212">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<title>ShipTok</title>
<link rel="manifest" href="/manifest.webmanifest">
<link rel="icon" href="/icon.svg">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=TikTok+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/app.css">
</head>
<body>
<aside class="sidebar">
  <div class="brand"><img src="/icon.svg" alt=""><b>ShipTok</b></div>
  <a class="mode" id="modeBtn" href="/demo"></a>
  <button class="search" id="refreshSide" title="Re-curate (R)"><svg viewBox="0 0 24 24"><path d="M20 12a8 8 0 1 1-2.34-5.66" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"/><path d="M20.5 3.5v5h-5" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/></svg><span>Refresh feed</span></button>
  <nav class="sidenav">
    <button data-nav="home" class="on"><svg viewBox="0 0 24 24"><path d="M3 10.5 12 3l9 7.5V20a1 1 0 0 1-1 1h-5v-6h-6v6H4a1 1 0 0 1-1-1z"/></svg><span>For You</span></button>
    <button data-nav="inbox"><svg viewBox="0 0 24 24"><path d="M4 4h16a1 1 0 0 1 1 1v11a1 1 0 0 1-1 1h-6l-4 3v-3H4a1 1 0 0 1-1-1V5a1 1 0 0 1 1-1z" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round"/><path d="M8 9h8M8 12.5h5" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg><span>Needs you</span><i class="badge needsCount" hidden></i></button>
    <button data-nav="agents"><svg viewBox="0 0 24 24"><rect x="4" y="7" width="16" height="12" rx="4" fill="none" stroke="currentColor" stroke-width="2"/><circle cx="9.5" cy="13" r="1.6"/><circle cx="14.5" cy="13" r="1.6"/><path d="M12 3v4" stroke="currentColor" stroke-width="2"/></svg><span>Agents</span><i class="badge soft agentsCount" hidden></i></button>
    <button data-nav="new"><svg viewBox="0 0 24 24"><path d="M12 4v16M4 12h16" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"/></svg><span>Capture</span></button>
    <button data-nav="profile"><svg viewBox="0 0 24 24"><circle cx="12" cy="8" r="4.2"/><path d="M3.5 21c.8-4.4 4.2-6.8 8.5-6.8s7.7 2.4 8.5 6.8z"/></svg><span>Profile</span></button>
  </nav>
  <div class="hud">
    <div class="hud-top">
      <div class="lvl"><svg viewBox="0 0 36 36"><circle cx="18" cy="18" r="16" class="track"/><circle cx="18" cy="18" r="16" class="fill" id="lvlRing" pathLength="100"/></svg><b id="lvlNum">1</b></div>
      <div><b id="xpText">0 XP</b><span id="xpNext"></span></div>
    </div>
    <div class="counts"><div><b id="streakNum">0</b><span>Day streak</span></div><div><b id="goalNum">0/10</b><span>Today</span></div><div><b id="combo">x1</b><span>Combo</span></div></div>
    <div class="bar"><i id="goalBar"></i></div>
  </div>
  <p class="keys"><kbd>J</kbd><kbd>K</kbd> scroll <kbd>A</kbd> agent <kbd>D</kbd> done <kbd>Z</kbd> later <kbd>S</kbd> skip <kbd>C</kbd> chat <kbd>O</kbd> open <kbd>R</kbd> refresh</p>
</aside>

<div class="stage" id="stage">
  <header class="topbar">
    <button class="tb-icon" id="liveBtn" aria-label="Agents at work"><svg viewBox="0 0 24 24"><rect x="4" y="7" width="16" height="12" rx="4" fill="none" stroke="currentColor" stroke-width="2"/><circle cx="9.5" cy="13" r="1.6"/><circle cx="14.5" cy="13" r="1.6"/><path d="M12 3v4" stroke="currentColor" stroke-width="2" stroke-linecap="round"/><circle cx="12" cy="3" r="1.4"/></svg><span class="live-dot" id="liveDot" hidden></span></button>
    <nav class="tabs" id="tabs"><button data-tab="agents">Agents</button><button data-tab="all" class="on">For You</button></nav>
    <button class="tb-icon" id="refresh" aria-label="Refresh feed"><svg viewBox="0 0 24 24"><path d="M20 12a8 8 0 1 1-2.34-5.66" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"/><path d="M20.5 3.5v5h-5" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/></svg></button>
  </header>
  <main id="feed" tabindex="-1"></main>
  <section id="profile" class="view" hidden></section>
  <div class="arrows"><button id="upBtn" aria-label="Previous"><svg viewBox="0 0 24 24"><path d="M6 14.5 12 8.5l6 6" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/></svg></button><button id="downBtn" aria-label="Next"><svg viewBox="0 0 24 24"><path d="M6 9.5l6 6 6-6" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/></svg></button></div>
</div>

<div id="sheet" class="sheet-wrap" hidden>
  <div class="scrim" data-close></div>
  <div class="sheet" role="dialog" aria-modal="true">
    <header class="sheet-head"><span id="sheetHead"></span><button class="x" data-close aria-label="Close"><svg viewBox="0 0 24 24"><path d="M6 6l12 12M18 6 6 18" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"/></svg></button></header>
    <div class="sheet-body" id="sheetBody"></div>
    <form class="sheet-input" id="sheetForm">
      <div class="avatar me">Y</div>
      <textarea id="sheetText" rows="1" placeholder="Say what to do…"></textarea>
      <button class="send" aria-label="Send"><svg viewBox="0 0 24 24"><path d="M3 11.5 21 3l-8.5 18-2-7.5z"/></svg></button>
    </form>
  </div>
</div>

<nav class="bottomnav" id="bottomnav">
  <button data-nav="home" class="on"><svg viewBox="0 0 24 24"><path d="M3 10.5 12 3l9 7.5V20a1 1 0 0 1-1 1h-5v-6h-6v6H4a1 1 0 0 1-1-1z"/></svg><span>Home</span></button>
  <button data-nav="agents"><svg viewBox="0 0 24 24"><rect x="4" y="7" width="16" height="12" rx="4" fill="none" stroke="currentColor" stroke-width="2"/><circle cx="9.5" cy="13" r="1.6"/><circle cx="14.5" cy="13" r="1.6"/><path d="M12 3v4" stroke="currentColor" stroke-width="2"/></svg><span>Agents</span><i class="badge soft agentsCount" hidden></i></button>
  <button data-nav="new" class="plus" aria-label="Capture a card"><b>+</b></button>
  <button data-nav="inbox"><svg viewBox="0 0 24 24"><path d="M4 4h16a1 1 0 0 1 1 1v11a1 1 0 0 1-1 1h-6l-4 3v-3H4a1 1 0 0 1-1-1V5a1 1 0 0 1 1-1z" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round"/><path d="M8 9h8M8 12.5h5" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg><span>Inbox</span><i class="badge needsCount" hidden></i></button>
  <button data-nav="profile"><svg viewBox="0 0 24 24"><circle cx="12" cy="8" r="4.2"/><path d="M3.5 21c.8-4.4 4.2-6.8 8.5-6.8s7.7 2.4 8.5 6.8z"/></svg><span>Profile</span></button>
</nav>

<div id="toast" role="status"></div>
<div id="xpfx" aria-hidden="true"></div>
<canvas id="confetti" aria-hidden="true"></canvas>

<template id="emptyTpl">
  <section class="card empty"><div class="slot"><div class="media"><div class="bgfx"></div>
    <div class="poster"><h2>All caught up</h2><p>Agents will drop back in here the moment they need you.</p><button class="pill-btn" id="emptySync">Refresh</button></div>
  </div></div></section>
</template>
<script src="/app.js" type="module"></script>
</body>
</html>
